<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="visor1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="suit1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg1)" rx="40" />
  <!-- Stars -->
  <circle cx="35" cy="40" r="1.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="165" cy="35" r="2" fill="#ec4899" opacity="0.7" />
  <circle cx="170" cy="90" r="1.5" fill="#f8fafc" opacity="0.6" />
  <circle cx="30" cy="120" r="2" fill="#818cf8" opacity="0.7" />
  <!-- Shoulders / Suit -->
  <path d="M 40 185 Q 40 145 100 145 Q 160 145 160 185 Z" fill="url(#suit1)" />
  <path d="M 85 145 L 85 185" stroke="#94a3b8" stroke-width="2" />
  <path d="M 115 145 L 115 185" stroke="#94a3b8" stroke-width="2" />
  <rect x="90" y="155" width="20" height="12" rx="3" fill="#0284c7" />
  <!-- Helmet Outer -->
  <circle cx="100" cy="95" r="48" fill="url(#suit1)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.4))" />
  <!-- Helmet Visor -->
  <ellipse cx="100" cy="95" rx="38" ry="32" fill="url(#visor1)" />
  <!-- Visor Reflection -->
  <path d="M 72 82 Q 95 72 120 76 Q 100 86 80 92 Z" fill="#ffffff" opacity="0.5" />
  <circle cx="124" cy="108" r="3" fill="#ffffff" opacity="0.6" />
</svg>

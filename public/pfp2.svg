<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="fur2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="earInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#701a75" />
    </linearGradient>
    <linearGradient id="visor2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg2)" rx="40" />
  <!-- Cyber grid accents -->
  <line x1="20" y1="170" x2="180" y2="170" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="20" y1="180" x2="180" y2="180" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <!-- Left Ear -->
  <polygon points="50,110 40,35 90,75" fill="url(#fur2)" />
  <polygon points="52,95 48,46 80,75" fill="url(#earInner)" />
  <!-- Right Ear -->
  <polygon points="150,110 160,35 110,75" fill="url(#fur2)" />
  <polygon points="148,95 152,46 120,75" fill="url(#earInner)" />
  <!-- Head Base -->
  <polygon points="45,105 100,65 155,105 100,165" fill="url(#fur2)" />
  <!-- White Cheeks -->
  <polygon points="45,105 75,130 100,165 65,145" fill="#f8fafc" />
  <polygon points="155,105 125,130 100,165 135,145" fill="#f8fafc" />
  <!-- Cyber Visor / Glasses -->
  <polygon points="58,95 100,105 142,95 135,115 100,125 65,115" fill="url(#visor2)" />
  <!-- Nose -->
  <polygon points="95,152 105,152 100,158" fill="#0f172a" />
  <!-- Neon cheek markings -->
  <line x1="52" y1="118" x2="68" y2="124" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="148" y1="118" x2="132" y2="124" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
